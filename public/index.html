<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123f38" />
    <title>Carta do Futuro | TCE-PR</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="pagina">
      <section class="hero" aria-labelledby="titulo">
        <p class="sobretitulo">Tribunal de Contas do Estado do Paraná</p>
        <h1 id="titulo">Carta do Futuro</h1>
        <p class="introducao">Que futuro queremos construir para o controle externo, as instituições públicas e a cidadania no Paraná?</p>
      </section>

      <section class="cartao" id="formulario-area">
        <form id="carta-form">
          <label class="campo" for="nome">
            <span>Como podemos chamar você?</span>
            <input id="nome" name="nome" maxlength="60" autocomplete="name" required placeholder="Seu nome" />
          </label>

          <div class="escolhas-cabecalho">
            <div>
              <h2>Escolha até 5 prioridades</h2>
              <p>Selecione os compromissos que considera essenciais para o futuro do TCE-PR.</p>
            </div>
            <strong id="contador" aria-live="polite">0 / 5</strong>
          </div>
          <div id="temas" class="temas"></div>
          <p id="erro" class="erro" role="alert"></p>
          <button id="gerar" type="submit">Receber minha carta</button>
        </form>

        <div id="carregando" class="carregando escondido" aria-live="polite">
          <span class="orbita" aria-hidden="true"></span>
          <p id="frase-carregando">Conectando com o futuro…</p>
        </div>
      </section>

      <section id="resultado" class="resultado escondido" aria-live="polite">
        <article class="carta" id="texto-carta"></article>
        <div class="acoes">
          <button class="secundario" id="copiar" type="button">Copiar carta</button>
          <button class="secundario" id="reiniciar" type="button">Fazer novas escolhas</button>
        </div>
      </section>
    </main>
    <script src="api-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
